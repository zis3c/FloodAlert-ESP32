[platformio]
default_envs = esp32dev

[env:esp32dev]
platform = espressif32@7.0.1
board = esp32dev
framework = arduino

monitor_speed = 115200
upload_speed = 921600
monitor_filters = time, default

check_tool = cppcheck
check_flags =
    cppcheck: --enable=warning,performance,portability --inconclusive
check_skip_packages = yes

lib_deps =
    adafruit/Adafruit GFX Library@1.13.0
    adafruit/Adafruit SSD1306@2.5.17
    adafruit/DHT sensor library@1.4.7
    adafruit/Adafruit Unified Sensor@1.1.15
    knolleary/PubSubClient@2.8.0

build_src_flags =
    -Wall
    -Wextra
    -Werror

build_flags =
    -D CORE_DEBUG_LEVEL=0
    ; Set these environment variables before building:
    ;   FLOOD_WIFI_SSID
    ;   FLOOD_WIFI_PASSWORD
    ;   FLOOD_MQTT_BROKER_HOST
    ;   FLOOD_MQTT_USERNAME (optional)
    ;   FLOOD_MQTT_PASSWORD (optional)
    -D FLOOD_WIFI_SSID=\"${sysenv.FLOOD_WIFI_SSID}\"
    -D FLOOD_WIFI_PASSWORD=\"${sysenv.FLOOD_WIFI_PASSWORD}\"
    -D FLOOD_MQTT_BROKER_HOST=\"${sysenv.FLOOD_MQTT_BROKER_HOST}\"
    -D FLOOD_MQTT_USERNAME=\"${sysenv.FLOOD_MQTT_USERNAME}\"
    -D FLOOD_MQTT_PASSWORD=\"${sysenv.FLOOD_MQTT_PASSWORD}\"

[env:native]
platform = native
test_framework = unity
